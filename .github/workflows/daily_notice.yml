name: Daily Announcement Automation

on:
  schedule:
    # Her gün İstanbul saatiyle 12:00 (saat başı GitHub'da en yoğun/gecikmeli dakika olduğu için 0 yerine 7 kullanıldı)
    - cron: '7 12 * * *'
      timezone: 'Europe/Istanbul'

  workflow_dispatch: # Manuel tetikleme

permissions:
  contents: write

env:
  TZ: Europe/Istanbul

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager python-dotenv

      - name: Run Selenium Script
        env:
          TANTANA_USER: ${{ secrets.TANTANA_USER }}
          TANTANA_PASSWORD: ${{ secrets.TANTANA_PASSWORD }}
        run: |
          echo "Automation starting at:"
          date
          python selenium_tantana_sosyal.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: automated daily announcement run"
            git push
          else
            echo "No changes to commit"
          fi
